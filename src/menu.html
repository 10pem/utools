<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu</title>
<link rel="stylesheet" href="menu.css">
</head>
<body>
<div class="menu">
  <div class="menu-header">
    <button class="pin-btn" id="pinBtn">📌</button>
    <span class="menu-title">桌面工具</span>
    <button class="close-btn" id="closeBtn">✕</button>
  </div>
  <div class="menu-items">
    <div class="menu-item" data-action="render-html">
      <span class="item-icon">🌐</span>
      <span class="item-label">Render HTML</span>
    </div>
    <div class="menu-item" data-action="json-format">
      <span class="item-icon">📋</span>
      <span class="item-label">JSON 格式化</span>
    </div>
    <div class="menu-item" data-action="curl-to-python">
      <span class="item-icon">🐍</span>
      <span class="item-label">CURL → Python</span>
    </div>
  </div>
  <div class="ts-section" id="tsSection" title="点击复制时间戳">
    <span class="ts-icon">⏱</span>
    <div class="ts-values">
      <div class="ts-seconds" id="tsSeconds">-</div>
      <div class="ts-ms" id="tsMs">- ms</div>
    </div>
  </div>
</div>
<script src="menu.js"></script>
</body>
</html>
