<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CURL → Python</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        font-family: -apple-system, "Segoe UI", sans-serif;
        background: #1e1e2e;
        color: #cdd6f4;
      }
      .container { display: flex; height: 100vh; }
      .editor-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .result-panel {
        width: 0;
        overflow: hidden;
        background: #181825;
        border-left: 1px solid #313244;
        display: flex;
        flex-direction: column;
        transition: width 0.2s;
      }
      .result-panel.open {
        width: 380px;
        min-width: 380px;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid #313244;
        flex-shrink: 0;
      }
      .header h2 { font-size: 14px; font-weight: 600; margin-right: auto; }
      .header-btn {
        background: #313244;
        border: none;
        color: #cdd6f4;
        padding: 5px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        transition: background 0.15s;
        white-space: nowrap;
      }
      .header-btn:hover { background: #45475a; }
      .header-btn:active { background: #585b70; }
      .header-btn.primary { background: #2a5c8a; }
      .header-btn.primary:hover { background: #3572a8; }
      .header-btn.primary:active { background: #4088c2; }
      .header-btn.success { background: #2a5c3a; color: #a6e3a1; }
      .header-btn.running { opacity: 0.6; pointer-events: none; }
      textarea {
        flex: 1;
        background: #11111b;
        border: none;
        outline: none;
        resize: none;
        font-family: 'Cascadia Code','Fira Code','Consolas',monospace;
        font-size: 13px;
        line-height: 1.6;
        color: #cdd6f4;
        padding: 16px;
        tab-size: 2;
        white-space: pre;
        overflow: auto;
      }
      .result-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid #313244;
        flex-shrink: 0;
      }
      .result-header h3 { font-size: 13px; font-weight: 600; }
      .result-header .status-badge {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 4px;
        font-weight: 500;
      }
      .search-bar {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-left: auto;
      }
      .search-input {
        width: 130px;
        background: #11111b;
        border: 1px solid #313244;
        color: #cdd6f4;
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 5px;
        outline: none;
        font-family: 'Cascadia Code','Fira Code','Consolas',monospace;
      }
      .search-input:focus { border-color: #45475a; }
      .search-input::placeholder { color: #585b70; }
      .search-count { font-size: 11px; color: #7f849c; min-width: 30px; text-align: center; }
      .search-nav-btn {
        background: #313244;
        border: none;
        color: #cdd6f4;
        width: 22px;
        height: 22px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 10px;
        line-height: 1;
        flex-shrink: 0;
      }
      .search-nav-btn:hover { background: #45475a; }
      .search-nav-btn:disabled { opacity: 0.4; cursor: default; }
      mark.search-hit { background: #f9e2af; color: #1e1e2e; border-radius: 2px; padding: 0 1px; }
      mark.search-hit.active { background: #f38ba8; color: #1e1e2e; }
      .status-badge.success { background: #1a3a2a; color: #a6e3a1; }
      .status-badge.error { background: #3a1a1a; color: #f38ba8; }
      .status-badge.running { background: #2a2a3a; color: #89b4fa; }
      .result-body {
        flex: 1;
        overflow: auto;
        padding: 14px;
        font-family: 'Cascadia Code','Fira Code','Consolas',monospace;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .error-text { color: #f38ba8; }
      .placeholder {
        color: #585b70;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        font-size: 13px;
      }
      .error-message {
        padding: 16px;
        color: #f38ba8;
        font-family: 'Cascadia Code','Fira Code','Consolas',monospace;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="editor-panel">
        <div class="header">
          <h2>🐍 Python requests</h2>
          <button class="header-btn primary" id="runBtn">▶ 执行</button>
          <button class="header-btn" id="copyBtn">📋 复制</button>
        </div>
        <textarea id="editor" spellcheck="false"></textarea>
      </div>
      <div class="result-panel" id="resultPanel">
        <div class="result-header">
          <h3>📥 响应结果</h3>
          <span class="status-badge" id="statusBadge">-</span>
          <div class="search-bar" id="searchBar" style="display:none">
            <input class="search-input" id="searchInput" placeholder="搜索…" spellcheck="false">
            <span class="search-count" id="searchCount">0/0</span>
            <button class="search-nav-btn" id="searchPrev" title="上一个 (Shift+Enter)">▲</button>
            <button class="search-nav-btn" id="searchNext" title="下一个 (Enter)">▼</button>
            <button class="search-nav-btn" id="searchClear" title="清除">✕</button>
          </div>
        </div>
        <div class="result-body" id="resultBody">
          <div class="placeholder">点击「执行」运行代码</div>
        </div>
      </div>
    </div>
    <script>
      const editor = document.getElementById('editor')
      const runBtn = document.getElementById('runBtn')
      const copyBtn = document.getElementById('copyBtn')
      const resultPanel = document.getElementById('resultPanel')
      const resultBody = document.getElementById('resultBody')
      const statusBadge = document.getElementById('statusBadge')
      const searchBar = document.getElementById('searchBar')
      const searchInput = document.getElementById('searchInput')
      const searchCount = document.getElementById('searchCount')
      const searchPrev = document.getElementById('searchPrev')
      const searchNext = document.getElementById('searchNext')
      const searchClear = document.getElementById('searchClear')

      let bodyText = ''
      let searchQuery = ''
      let searchHits = []
      let searchIndex = -1

      function escapeRegExp(s) {
        return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
      }

      function renderResultBody(text, query) {
        resultBody.innerHTML = ''
        if (!text) return
        if (!query) {
          resultBody.appendChild(document.createTextNode(text))
          return
        }
        const regex = new RegExp(escapeRegExp(query), 'gi')
        let lastIndex = 0
        let m
        searchHits = []
        while ((m = regex.exec(text)) !== null) {
          if (m.index > lastIndex) {
            resultBody.appendChild(document.createTextNode(text.slice(lastIndex, m.index)))
          }
          const mark = document.createElement('mark')
          mark.className = 'search-hit'
          mark.textContent = m[0]
          resultBody.appendChild(mark)
          searchHits.push(mark)
          lastIndex = m.index + m[0].length
        }
        if (lastIndex < text.length) {
          resultBody.appendChild(document.createTextNode(text.slice(lastIndex)))
        }
        searchIndex = searchHits.length ? 0 : -1
        updateSearchUI()
      }

      function updateSearchUI() {
        searchHits.forEach((el, i) => {
          el.classList.toggle('active', i === searchIndex)
        })
        const total = searchHits.length
        searchCount.textContent = total ? `${searchIndex + 1}/${total}` : '0/0'
        if (total) searchHits[searchIndex].scrollIntoView({ block: 'center' })
      }

      function applySearch() {
        searchQuery = searchInput.value
        renderResultBody(bodyText, searchQuery)
      }

      function clearSearch() {
        searchInput.value = ''
        searchQuery = ''
        searchHits = []
        searchIndex = -1
        searchCount.textContent = '0/0'
        renderResultBody(bodyText, '')
      }

      searchInput.addEventListener('input', applySearch)

      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault()
          if (!searchHits.length) return
          searchIndex = (searchIndex + 1) % searchHits.length
          updateSearchUI()
        } else if (e.key === 'Escape') {
          clearSearch()
          searchInput.blur()
        }
      })

      searchNext.addEventListener('click', () => {
        if (!searchHits.length) return
        searchIndex = (searchIndex + 1) % searchHits.length
        updateSearchUI()
      })

      searchPrev.addEventListener('click', () => {
        if (!searchHits.length) return
        searchIndex = (searchIndex - 1 + searchHits.length) % searchHits.length
        updateSearchUI()
      })

      searchClear.addEventListener('click', clearSearch)

      window.api.onCurlResult(({ code, error }) => {
        if (error) {
          editor.value = ''
          editor.placeholder = error
          editor.classList.add('error-text')
          runBtn.style.display = 'none'
          copyBtn.style.display = 'none'
        } else {
          editor.classList.remove('error-text')
          editor.value = code
          runBtn.style.display = ''
          copyBtn.style.display = ''
        }
      })

      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(editor.value)
        copyBtn.textContent = '✅ 已复制'
        copyBtn.classList.add('success')
        setTimeout(() => {
          copyBtn.textContent = '📋 复制'
          copyBtn.classList.remove('success')
        }, 2000)
      })

      runBtn.addEventListener('click', async () => {
        const code = editor.value
        if (!code.trim()) return

        resultPanel.classList.add('open')
        resultBody.textContent = ''
        resultBody.className = 'result-body'
        bodyText = ''
        clearSearch()
        searchBar.style.display = 'none'
        statusBadge.textContent = '运行中…'
        statusBadge.className = 'status-badge running'
        runBtn.textContent = '⏳ 执行中…'
        runBtn.classList.add('running')

        try {
          const res = await window.api.executePython(code)
          statusBadge.textContent = res.statusCode ? `${res.statusCode}` : '错误'
          statusBadge.className = 'status-badge ' + (res.statusCode ? 'success' : 'error')

          if (res.error) {
            bodyText = res.error
            resultBody.className = 'result-body error-text'
          } else {
            bodyText = res.body || '(空响应)'
            resultBody.className = 'result-body'
          }
          renderResultBody(bodyText, '')
          searchBar.style.display = 'flex'
        } catch (e) {
          statusBadge.textContent = '错误'
          statusBadge.className = 'status-badge error'
          bodyText = e.message
          resultBody.className = 'result-body error-text'
          renderResultBody(bodyText, '')
          searchBar.style.display = 'flex'
        } finally {
          runBtn.textContent = '▶ 执行'
          runBtn.classList.remove('running')
        }
      })

      editor.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
          e.preventDefault()
          const start = editor.selectionStart
          const end = editor.selectionEnd
          editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end)
          editor.selectionStart = editor.selectionEnd = start + 2
        }
      })
    </script>
  </body>
</html>
