<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Timestamp</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  user-select: none;
  overflow: hidden;
}
.popup {
  background: rgba(28, 28, 32, 0.95);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  padding: 12px 14px;
  margin: 4px;
  box-shadow: 0 8px 40px rgba(0, 0, 0, 0.45);
}
.header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  margin-bottom: 10px;
}
.header .title { font-size: 12px; color: rgba(255, 255, 255, 0.85); font-weight: 600; }
.header .unit-tag {
  margin-left: auto;
  font-size: 10px;
  color: #4FC3F7;
  background: rgba(79, 195, 247, 0.12);
  padding: 2px 8px;
  border-radius: 10px;
}
.row { display: flex; align-items: baseline; gap: 10px; padding: 3px 0; }
.row .label { font-size: 11px; color: rgba(255, 255, 255, 0.4); width: 56px; flex-shrink: 0; }
.row .value { font-size: 14px; color: rgba(255, 255, 255, 0.92); font-family: 'Cascadia Code','Fira Code','Consolas',monospace; }
.row .value.mono-sm { font-size: 12.5px; }
.row .value.rel { color: #a6e3a1; font-family: inherit; font-size: 13px; }
.hint {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
  text-align: center;
  font-size: 11px;
  color: rgba(255, 255, 255, 0.35);
  cursor: pointer;
  border-radius: 6px;
  padding-bottom: 4px;
  transition: all 0.15s;
}
.hint:hover { background: rgba(255, 255, 255, 0.06); color: rgba(255, 255, 255, 0.7); }
.hint.copied { color: #a6e3a1; }
</style>
</head>
<body>
<div class="popup">
  <div class="header">
    <span class="title">⏱ 时间戳</span>
    <span class="unit-tag" id="unitTag">秒 (s)</span>
  </div>
  <div class="row">
    <span class="label">原值</span>
    <span class="value" id="rawValue">-</span>
  </div>
  <div class="row">
    <span class="label">本地时间</span>
    <span class="value mono-sm" id="localTime">-</span>
  </div>
  <div class="row">
    <span class="label">UTC 时间</span>
    <span class="value mono-sm" id="utcTime">-</span>
  </div>
  <div class="row">
    <span class="label">相对时间</span>
    <span class="value rel" id="relative">-</span>
  </div>
  <div class="hint" id="hint">📋 点击复制本地时间</div>
</div>
<script src="timestamp.js"></script>
</body>
</html>
